<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Alex — Tennessee Tech AdmitSpace</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f4f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      border: 1px solid #e4e4e7;
      width: 100%;
      max-width: 400px;
      overflow: hidden;
    }

    /* Header */
    .header {
      padding: 14px 16px;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, #4a2c8a 0%, #6b3fa0 100%);
    }
    .header-text h2 { color: #fff !important; }
    .header-text p { color: rgba(255,255,255,0.75) !important; }
    .avatar {
      width: 48px; height: 48px;
      border-radius: 50%;
      flex-shrink: 0;
      overflow: hidden;
      border: 2px solid #e4e4e7;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
    .logo { width: 32px; height: 32px; border-radius: 6px; overflow: hidden; flex-shrink: 0; }
    .logo img { width: 100%; height: 100%; object-fit: cover; }
    .header-text h2 { font-size: 14px; font-weight: 600; color: #111; }
    .header-text p  { font-size: 12px; color: #71717a; margin-top: 1px; }
    .live-badge {
      margin-left: auto;
      font-size: 11px; font-weight: 500;
      background: #d1fae5; color: #065f46;
      padding: 3px 8px; border-radius: 99px;
    }

    /* Chat */
    .chat {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 260px;
      max-height: 320px;
      overflow-y: auto;
    }
    .bubble {
      max-width: 86%;
      padding: 10px 13px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.5;
    }
    .bubble.bot  {
      background: #f4f4f5;
      color: #111;
      align-self: flex-start;
      border-radius: 2px 12px 12px 12px;
    }
    .bubble.user {
      background: #d1fae5;
      color: #064e3b;
      align-self: flex-end;
      border-radius: 12px 2px 12px 12px;
    }
    .bubble.status {
      background: none;
      color: #a1a1aa;
      font-size: 12px;
      align-self: flex-start;
      padding: 4px 0;
    }
    .typing-dots { display: flex; gap: 4px; align-items: center; padding: 4px 0; }
    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #a1a1aa;
      animation: bounce 1.2s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: .2s; }
    .dot:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce {
      0%,80%,100% { transform: translateY(0); }
      40%          { transform: translateY(-5px); }
    }

    /* Controls */
    .controls {
      padding: 14px 16px 18px;
      border-top: 1px solid #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .waveform {
      display: none;
      align-items: center;
      gap: 3px;
      height: 24px;
    }
    .waveform.active { display: flex; }
    .bar {
      width: 3px; border-radius: 2px;
      background: #ef4444;
    }
    @keyframes wave {
      0%,100% { height: 4px; }
      50%      { height: 18px; }
    }

    .mic-btn {
      width: 60px; height: 60px;
      border-radius: 50%;
      border: 1px solid #e4e4e7;
      background: #fff;
      cursor: pointer;
      font-size: 24px;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s, transform .1s, border-color .15s;
      user-select: none;
    }
    .mic-btn:hover  { background: #f4f4f5; }
    .mic-btn:active { transform: scale(.95); }
    .mic-btn.listening {
      background: #fef2f2;
      border-color: #ef4444;
      animation: pulse 1.2s ease-out infinite;
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(239,68,68,.3); }
      70%  { box-shadow: 0 0 0 10px rgba(239,68,68,0); }
      100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); }
    }

    .status-label {
      font-size: 12px;
      color: #a1a1aa;
    }

    /* Text fallback input */
    .text-row {
      display: flex;
      gap: 6px;
      width: 100%;
    }
    .text-row input {
      flex: 1;
      padding: 8px 12px;
      font-size: 13px;
      border: 1px solid #e4e4e7;
      border-radius: 8px;
      outline: none;
      color: #111;
      background: #fff;
    }
    .text-row input:focus { border-color: #6ee7b7; }
    .text-row button {
      padding: 8px 14px;
      font-size: 13px;
      background: #059669;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .text-row button:hover { background: #047857; }

    .divider {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: #d4d4d8;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #f0f0f0;
    }
  </style>
</head>

      <span class="live-badge" id="liveBadge">Connecting…</span>
    </div>
  </div>

  <div class="chat" id="chat">
    <div class="typing-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  </div>

  <div class="controls">

    <div class="waveform" id="waveform">
      <!-- bars generados por JS -->
    </div>

    <button class="mic-btn" id="micBtn" onclick="toggleMic()" aria-label="Hold to speak">🎤</button>
    <span class="status-label" id="statusLabel">Connecting…</span>

    <div class="divider">or type</div>

    <div class="text-row">
      <input type="text" id="textInput" placeholder="Ask Alex anything…" onkeydown="if(event.key==='Enter') sendText()"/>
      <button onclick="sendText()">Send</button>
    </div>

  </div>
</div>

<script>
  // ── CONFIG ──────────────────────────────────────────────
  // Cambia esta URL cuando uses ngrok
  const WS_URL   = "ws://localhost:8000/ws";
  const TOKEN    = "zepur2025";
  // ────────────────────────────────────────────────────────

  const chat        = document.getElementById("chat");
  const micBtn      = document.getElementById("micBtn");
  const statusLabel = document.getElementById("statusLabel");
  const liveBadge   = document.getElementById("liveBadge");
  const waveform    = document.getElementById("waveform");

  let ws, mediaRecorder, audioChunks = [], isRecording = false;

  // Generar barras de waveform
  for (let i = 0; i < 11; i++) {
    const b = document.createElement("div");
    b.className = "bar";
    b.style.animation = `wave ${0.4 + Math.random() * 0.5}s ease-in-out infinite ${i * 0.06}s`;
    b.style.height = "4px";
    waveform.appendChild(b);
  }

  // ── WebSocket ─────────────────────────────────────────
  function connect() {
    ws = new WebSocket(`${WS_URL}?token=${TOKEN}`);

    ws.onopen = () => {
      liveBadge.textContent = "● Live";
      liveBadge.style.background = "#d1fae5";
      liveBadge.style.color = "#065f46";
      setStatus("Tap mic to speak");
    };

    ws.onclose = () => {
      liveBadge.textContent = "Disconnected";
      liveBadge.style.background = "#fee2e2";
      liveBadge.style.color = "#991b1b";
      setStatus("Reconnecting…");
      setTimeout(connect, 3000);
    };

    ws.onerror = () => setStatus("Connection error");

    ws.onmessage = (event) => {
      const msg = JSON.parse(event.data);

      if (msg.type === "greeting" || msg.type === "bot_response") {
        removeTyping();
        addBubble(msg.text, "bot");
        playAudio(msg.audio);
        setStatus("Tap mic to speak");
        micBtn.disabled = false;
      }

      if (msg.type === "user_text") {
        addBubble(msg.text, "user");
        addTyping();
      }

      if (msg.type === "status") {
        setStatus(msg.message);
      }

      if (msg.type === "error") {
        setStatus("Error: " + msg.message);
      }
    };
  }

  connect();

  // ── Audio playback ────────────────────────────────────
  function playAudio(base64mp3) {
    const audio = new Audio("data:audio/mpeg;base64," + base64mp3);
    audio.play().catch(e => console.warn("Autoplay blocked:", e));
  }

  // ── Mic recording ─────────────────────────────────────
  async function toggleMic() {
    if (isRecording) {
      stopRecording();
    } else {
      await startRecording();
    }
  }

  async function startRecording() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream, { mimeType: "audio/webm" });
      audioChunks = [];

      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.onstop = () => {
        const blob = new Blob(audioChunks, { type: "audio/webm" });
        blob.arrayBuffer().then(buf => ws.send(buf));
        stream.getTracks().forEach(t => t.stop());
      };

      mediaRecorder.start();
      isRecording = true;
      micBtn.classList.add("listening");
      micBtn.innerHTML = "⏹";
      waveform.classList.add("active");
      setStatus("Listening… tap again to send");
    } catch (err) {
      setStatus("Mic access denied");
    }
  }

  function stopRecording() {
    if (mediaRecorder && isRecording) {
      mediaRecorder.stop();
      isRecording = false;
      micBtn.classList.remove("listening");
      micBtn.innerHTML = "🎤";
      waveform.classList.remove("active");
      setStatus("Processing…");
      micBtn.disabled = true;
    }
  }

  // ── Text input fallback ───────────────────────────────
  function sendText() {
    const input = document.getElementById("textInput");
    const text  = input.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
    addBubble(text, "user");
    ws.send(JSON.stringify({ type: "text_input", text }));
    input.value = "";
    addTyping();
    setStatus("Processing…");
  }

  // ── UI helpers ────────────────────────────────────────
  function addBubble(text, type) {
    const d = document.createElement("div");
    d.className = "bubble " + type;
    d.textContent = text;
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
  }

  function addTyping() {
    removeTyping();
    const d = document.createElement("div");
    d.className = "typing-dots";
    d.id = "typing";
    [1,2,3].forEach(() => {
      const dot = document.createElement("div");
      dot.className = "dot";
      d.appendChild(dot);
    });
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
  }

  function removeTyping() {
    document.getElementById("typing")?.remove();
  }

  function setStatus(msg) {
    statusLabel.textContent = msg;
  }
</script>
